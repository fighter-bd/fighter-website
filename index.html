<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIGHTER | Developed by Borno Sarker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#f3f6ff;
--card:#ffffff;
--text:#000;
--primary:#1e40af;
}

body.dark{
--bg:#0b1220;
--card:#0f172a;
--text:#ffffff;
--primary:#60a5fa;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

.container{
max-width:1000px;
margin:auto;
background:var(--card);
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo img{
width:70px;
border-radius:50%;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
background:var(--primary);
color:white;
cursor:pointer;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}

.box{
padding:10px;
color:white;
border-radius:8px;
text-align:center;
font-weight:bold;
}

.income{background:#16a34a;}
.expense{background:#dc2626;}
.balance{background:#1e40af;}

.form{
margin-top:15px;
display:grid;
grid-template-columns:1fr 1fr 1fr 1fr auto;
gap:8px;
}

input,select{
padding:8px;
border-radius:5px;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:var(--primary);
color:white;
}

/* calculator */

.calculator{
margin-top:30px;
max-width:300px;
background:#eee;
padding:15px;
border-radius:10px;
}

.calc-display{
width:100%;
height:40px;
font-size:20px;
text-align:right;
margin-bottom:10px;
}

.calc-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
}

.calc-grid button{
padding:10px;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<div class="top">

<div style="display:flex;align-items:center;gap:10px">

<div class="logo">
<img src="fighter-cricket-logo.png">
</div>

<div>
<h2>FIGHTER</h2>
<p>Developed by Borno Sarker</p>
</div>

</div>

<button onclick="toggleDark()">🌙 Dark Mode</button>

</div>

<div class="summary">

<div class="box income">
মোট জমা<br>
৳ <span id="income">0</span>
</div>

<div class="box expense">
মোট ব্যয়<br>
৳ <span id="expense">0</span>
</div>

<div class="box balance">
ব্যালেন্স<br>
৳ <span id="balance">0</span>
</div>

</div>

<div class="form">

<input id="title" placeholder="বিবরণ">
<input id="amount" type="number" placeholder="টাকা">

<select id="category">
<option>Football</option>
<option>Bat</option>
<option>Ball</option>
<option>Jersey</option>
<option>Shoes</option>
</select>

<input type="date" id="date">

<select id="type">
<option value="income">জমা</option>
<option value="expense">ব্যয়</option>
</select>

<button onclick="add()">যোগ</button>

</div>

<table>

<tr>
<th>বিবরণ</th>
<th>ক্যাটাগরি</th>
<th>তারিখ</th>
<th>ধরন</th>
<th>টাকা</th>
<th>ডিলিট</th>
</tr>

<tbody id="list"></tbody>

</table>

<canvas id="chart"></canvas>

<div class="calculator">

<h3>Calculator</h3>

<input class="calc-display" id="display">

<div class="calc-grid">

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('/')">÷</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('*')">×</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button onclick="press('-')">−</button>

<button onclick="press('0')">0</button>
<button onclick="clearCalc()">C</button>
<button onclick="calculate()">=</button>
<button onclick="press('+')">+</button>

</div>

</div>

</div>

<script>

let data=[]

function add(){

let title=document.getElementById("title").value
let amount=Number(document.getElementById("amount").value)
let category=document.getElementById("category").value
let date=document.getElementById("date").value
let type=document.getElementById("type").value

data.push({title,amount,category,date,type})

render()

}

function remove(i){
data.splice(i,1)
render()
}

function render(){

let list=document.getElementById("list")

let income=0
let expense=0

list.innerHTML=""

data.forEach((d,i)=>{

if(d.type=="income") income+=d.amount
else expense+=d.amount

list.innerHTML+=`
<tr>
<td>${d.title}</td>
<td>${d.category}</td>
<td>${d.date}</td>
<td>${d.type=="income"?"জমা":"ব্যয়"}</td>
<td>${d.amount}</td>
<td><button onclick="remove(${i})">X</button></td>
</tr>
`

})

document.getElementById("income").innerText=income
document.getElementById("expense").innerText=expense
document.getElementById("balance").innerText=income-expense

}

function toggleDark(){
document.body.classList.toggle("dark")
}

function press(v){
document.getElementById("display").value+=v
}

function clearCalc(){
document.getElementById("display").value=""
}

function calculate(){
let x=document.getElementById("display").value
document.getElementById("display").value=eval(x)
}

</script>

</body>
</html>
