<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADITA CAKE HOUSE</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      background:#f5f5f5;
    }
    header{
      background:#ff4d6d;
      padding:15px;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .logo{
      font-size:20px;
      font-weight:bold;
    }
    .cart-btn{
      background:white;
      color:#ff4d6d;
      border:none;
      padding:6px 10px;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }
    .search-box input{
      padding:8px;
      width:180px;
      border-radius:5px;
      border:none;
    }
    .banner{
      background:url('https://images.unsplash.com/photo-1542826438-bd32f43d626f') center/cover;
      height:200px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:26px;
      font-weight:bold;
      text-shadow:2px 2px 5px black;
      text-align:center;
      padding:10px;
    }
    .categories{
      display:flex;
      gap:10px;
      padding:10px;
      overflow-x:auto;
      background:white;
    }
    .cat{
      background:#ffccd5;
      padding:10px;
      border-radius:10px;
      white-space:nowrap;
    }
    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      padding:10px;
    }
    .card{
      background:white;
      padding:10px;
      border-radius:10px;
      text-align:center;
    }
    .card img{
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:10px;
    }
    .add-btn{
      background:#ff4d6d;
      color:white;
      padding:6px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      margin-top:5px;
      width:100%;
    }
    footer{
      text-align:center;
      padding:15px;
      background:#222;
      color:white;
      margin-top:20px;
    }

    /* cart modal */
    .modal{
      display:none;
      position:fixed;
      top:0;left:0;
      width:100%;height:100%;
      background:rgba(0,0,0,0.6);
    }
    .modal-content{
      background:white;
      margin:10% auto;
      padding:15px;
      width:90%;
      max-width:400px;
      border-radius:10px;
    }
    .close{
      float:right;
      cursor:pointer;
      font-size:20px;
    }
    .place-btn{
      background:#25D366;
      color:white;
      padding:8px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ADITA CAKE HOUSE 🍰</div>
  <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<div class="banner">
  Fresh Cake Delivery - Only 25 Taka Cup Cake
</div>

<div class="categories">
  <div class="cat">Cup Cake</div>
  <div class="cat">Chocolate Cake</div>
  <div class="cat">Birthday Cake</div>
  <div class="cat">Custom Cake</div>
</div>

<div class="products">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1519869325930-281384150729" />
    <h4>Cup Cake</h4>
    <p>25 Taka</p>
    <button class="add-btn" onclick="addToCart('Cup Cake',25)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587" />
    <h4>Chocolate Cake</h4>
    <p>500 Taka</p>
    <button class="add-btn" onclick="addToCart('Chocolate Cake',500)">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c" />
    <h4>Birthday Cake</h4>
    <p>800 Taka</p>
    <button class="add-btn" onclick="addToCart('Birthday Cake',800)">Add to Cart</button>
  </div>
</div>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <span class="close" onclick="closeCart()">&times;</span>
    <h3>Your Cart 🛒</h3>
    <div id="cartItems"></div>
    <hr>
    <p><b>Total: </b><span id="total">0</span> Taka</p>
    <button class="place-btn" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<footer>
  © 2026 ADITA CAKE HOUSE | Contact: +8801303780409
</footer>

<script>
let cart = [];

function addToCart(name, price){
  cart.push({name, price});
  document.getElementById('cartCount').innerText = cart.length;
  alert(name + " added to cart!");
}

function openCart(){
  document.getElementById('cartModal').style.display='block';
  renderCart();
}

function closeCart(){
  document.getElementById('cartModal').style.display='none';
}

function renderCart(){
  let html = "";
  let total = 0;
  cart.forEach(item=>{
    html += `<p>${item.name} - ${item.price} Taka</p>`;
    total += item.price;
  });
  document.getElementById('cartItems').innerHTML = html;
  document.getElementById('total').innerText = total;
}

function placeOrder(){
  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  let msg = "Order from ADITA CAKE HOUSE:\n";
  let total = 0;

  cart.forEach(item=>{
    msg += item.name + " - " + item.price + " Taka\n";
    total += item.price;
  });

  msg += "Total: " + total + " Taka";

  alert("Order placed successfully!\n\n" + msg);

  cart = [];
  document.getElementById('cartCount').innerText = 0;
  closeCart();
}
</script>

</body>
</html>
