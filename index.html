<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="description" content="Welcome to the official Fighter website...">

<title>FIGHTER </title>

<link rel="icon" type="image/png" href="fighter-cricket-logo.png">

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.dark{
background:#111;
color:white;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

.dark .container{
background:#1e1e1e;
}

.logo{
width:150px;
display:block;
margin:auto;
}

button{
padding:8px 12px;
border:none;
background:#2563eb;
color:white;
border-radius:5px;
cursor:pointer;
margin:3px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#2563eb;
color:white;
}

.dark th{
background:#444;
}

input{
padding:8px;
margin:5px;
}

.summary{
display:flex;
gap:10px;
margin-top:15px;
}

.box{
flex:1;
padding:10px;
color:white;
border-radius:8px;
text-align:center;
}

.income{background:green;}
.balance{background:#2563eb;}
.expense{background:red;}

.calc{
max-width:250px;
margin:30px auto;
background:#ddd;
padding:15px;
border-radius:10px;
}

.dark .calc{
background:#222;
}

.calc input{
width:100%;
height:40px;
text-align:right;
margin-bottom:10px;
font-size:18px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
}

.grid button{
padding:10px;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<img src="fighter-cricket-logo.png" class="logo">

<h2>FIGHTER Cricket Club হিসাব</h2> <p>
📧 Email:
<a href="mailto:fighterbd.com123@gmail.com">
fighterbd.com123@gmail.com
</a>
</p>

<button onclick="dark()">Dark Mode</button>

<div class="summary">
<div class="box income">
মোট টাকা<br><span id="totalMoney">0</span>
</div>
<div class="box expense">
মোট বাকি<br><span id="totalRemaining">0</span>
</div>
<div class="box balance">
মোট সদস্য<br><span id="totalMembers">0</span>
</div>
</div>

<br>

<input id="search" placeholder="Search..." onkeyup="render()">

<br>

<input id="member" placeholder="সদস্যের নাম">
<input id="item" placeholder="খেলাধুলার জিনিস">
<input id="price" type="number" placeholder="জিনিসের মোট দাম">
<input id="paid" type="number" placeholder="সদস্যের দেওয়া টাকা">
<input type="date" id="date">

<br>

<button onclick="add()">যোগ</button>
<button onclick="download()">Excel Download</button>

<table>

<tr>
<th>নাম</th>
<th>জিনিস</th>
<th>তারিখ</th>
<th>মোট দাম</th>
<th>দেওয়া টাকা</th>
<th>বাকি টাকা</th>
<th>পরিবর্তন</th>
</tr>

<tbody id="list"></tbody>

</table>

</div>

<div class="calc">

<h3>Calculator</h3>

<input id="display">

<div class="grid">

<button onclick="p('7')">7</button>
<button onclick="p('8')">8</button>
<button onclick="p('9')">9</button>
<button onclick="p('/')">÷</button>

<button onclick="p('4')">4</button>
<button onclick="p('5')">5</button>
<button onclick="p('6')">6</button>
<button onclick="p('*')">×</button>

<button onclick="p('1')">1</button>
<button onclick="p('2')">2</button>
<button onclick="p('3')">3</button>
<button onclick="p('-')">-</button>

<button onclick="p('0')">0</button>
<button onclick="clearCalc()">C</button>
<button onclick="calc()">=</button>
<button onclick="p('+')">+</button>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("fighterData")) || []

function save(){
localStorage.setItem("fighterData", JSON.stringify(data))
}

function add(){

let member=document.getElementById("member").value
let item=document.getElementById("item").value
let price=Number(document.getElementById("price").value)
let paid=Number(document.getElementById("paid").value)
let date=document.getElementById("date").value

if(!member || !item || !price || !date){
alert("সব ফিল্ড পূরণ করুন")
return
}

let remaining = price - paid

data.push({member,item,price,paid,remaining,date})

save()

render()

}

function edit(i){

let d=data[i]

document.getElementById("member").value=d.member
document.getElementById("item").value=d.item
document.getElementById("price").value=d.price
document.getElementById("paid").value=d.paid
document.getElementById("date").value=d.date

data.splice(i,1)

save()

render()

}

function del(i){

data.splice(i,1)

save()

render()

}

function render(){

let list=document.getElementById("list")

let search=document.getElementById("search").value.toLowerCase()

list.innerHTML=""

let totalMoney=0
let totalRemaining=0
let membersSet = new Set()

data.forEach((d,i)=>{

if(
d.member.toLowerCase().includes(search) ||
d.item.toLowerCase().includes(search)
){

let remaining=d.price-d.paid
totalMoney += d.price
totalRemaining += remaining
membersSet.add(d.member)

list.innerHTML+=`

<tr>

<td>${d.member}</td>
<td>${d.item}</td>
<td>${d.date}</td>
<td>${d.price}</td>
<td>${d.paid}</td>
<td>${remaining}</td>

<td>

<button onclick="edit(${i})">Edit</button>
<button onclick="del(${i})">Delete</button>

</td>

</tr>

`

}

})

// Update summary
document.getElementById("totalMoney").innerText = totalMoney
document.getElementById("totalRemaining").innerText = totalRemaining
document.getElementById("totalMembers").innerText = membersSet.size

}

render()

function download(){

let csv="member,item,date,price,paid,remaining\n"

data.forEach(d=>{

let remaining=d.price-d.paid

csv+=`${d.member},${d.item},${d.date},${d.price},${d.paid},${remaining}\n`

})

let blob=new Blob([csv])

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="fighter_hisab.csv"

a.click()

}

function dark(){
document.body.classList.toggle("dark")
}

function p(v){
display.value+=v
}

function clearCalc(){
display.value=""
}

function calc(){
display.value=eval(display.value)
}

</script>
