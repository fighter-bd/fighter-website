<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGHTER হিসাব রাখার ওয়েবসাইট | Borno Sarker</title>
<style>
body{font-family:Arial; margin:0; background:#f2f2f2;}
.dark{background:#111; color:white;}
.container{max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px;}
.logo{max-width:150px; display:block; margin:auto;}
button{padding:8px 12px; border:none; background:#2563eb; color:white; border-radius:5px; cursor:pointer;}
table{width:100%; border-collapse:collapse; margin-top:10px;}
th,td{border:1px solid #ccc; padding:8px; text-align:center;}
th{background:#2563eb; color:white;}
.summary{display:flex; gap:10px; margin-top:10px;}
.box{flex:1; padding:10px; color:white; border-radius:8px; text-align:center;}
.income{background:green;}
.expense{background:red;}
.balance{background:#2563eb;}
.calc{max-width:250px; margin-top:20px;}
.calc input{width:100%; height:40px; text-align:right; font-size:18px; margin-bottom:5px;}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
.grid button{padding:10px; font-size:18px;}
input,select{padding:8px; margin:5px 0; width:100%;}
</style>
</head>

<body>
<div class="container">

<img src="https://i.ibb.co/8b9H0bZ/fighter-logo.png" class="logo" alt="FIGHTER Logo">

<h2>FIGHTER</h2>
<p>Developed by Borno Sarker</p>

<button onclick="dark()">🌙 Dark Mode</button>

<div class="summary">
<div class="box income">
মোট জমা<br>
<span id="income">0</span>
</div>
<div class="box expense">
মোট ব্যয়<br>
<span id="expense">0</span>
</div>
<div class="box balance">
বাকি টাকা<br>
<span id="balance">0</span>
</div>
</div>

<br>
<input id="search" placeholder="Search..." onkeyup="render()">
<br><br>

<input id="member" placeholder="নাম">
<input id="title" placeholder="খেলাধুলার জিনিসপত্র">
<input id="amount" type="number" placeholder="টাকা">
<input id="memberAmount" type="number" placeholder="সদস্যের দেওয়া টাকা">
<input type="date" id="date">

<select id="type">
<option value="income">জমা</option>
<option value="expense">ব্যয়</option>
</select>

<button onclick="add()">যোগ</button>
<button onclick="download()">Excel Download</button>

<table>
<tr>
<th>নাম</th>
<th>বিবরণ</th>
<th>তারিখ</th>
<th>ধরন</th>
<th>টাকা</th>
<th>সদস্যের টাকা</th>
<th>বাকি টাকা</th>
<th>পরিবর্তন</th>
</tr>
<tbody id="list"></tbody>
</table>

<h3>📅 Monthly Report</h3>
<div id="report"></div>

<div class="calc">
<h3>Calculator</h3>
<input id="display">
<div class="grid">
<button onclick="p('7')">7</button>
<button onclick="p('8')">8</button>
<button onclick="p('9')">9</button>
<button onclick="p('/')">÷</button>
<button onclick="p('4')">4</button>
<button onclick="p('5')">5</button>
<button onclick="p('6')">6</button>
<button onclick="p('*')">×</button>
<button onclick="p('1')">1</button>
<button onclick="p('2')">2</button>
<button onclick="p('3')">3</button>
<button onclick="p('-')">-</button>
<button onclick="p('0')">0</button>
<button onclick="clearCalc()">C</button>
<button onclick="calc()">=</button>
<button onclick="p('+')">+</button>
</div>
</div>

</div>

<script>
let data=[]

function add(){
  let member=document.getElementById("member").value
  let title=document.getElementById("title").value
  let amount=Number(document.getElementById("amount").value)
  let memberAmount=Number(document.getElementById("memberAmount").value)
  let date=document.getElementById("date").value
  let type=document.getElementById("type").value

  if(!member || !title || !amount || !date){
      alert("সব ফিল্ড পূরণ করুন!")
      return
  }

  data.push({member,title,amount,memberAmount,date,type})
  render()
}

function edit(i){
  let d=data[i]
  document.getElementById("member").value=d.member
  document.getElementById("title").value=d.title
  document.getElementById("amount").value=d.amount
  document.getElementById("memberAmount").value=d.memberAmount
  document.getElementById("date").value=d.date
  document.getElementById("type").value=d.type
  data.splice(i,1)
  render()
}

function render(){
  let list=document.getElementById("list")
  let search=document.getElementById("search").value.toLowerCase()
  list.innerHTML=""
  let income=0, expense=0

  data.forEach((d,i)=>{
    if(!d.member.toLowerCase().includes(search) && !d.title.toLowerCase().includes(search)) return

    if(d.type=="income") income+=d.amount
    else expense+=d.amount

    let balance=income-expense

    list.innerHTML+=`
    <tr>
      <td>${d.member}</td>
      <td>${d.title}</td>
      <td>${d.date}</td>
      <td>${d.type=="income"?"জমা":"ব্যয়"}</td>
      <td>${d.amount}</td>
      <td>${d.memberAmount || 0}</td>
      <td>${balance}</td>
      <td><button onclick="edit(${i})">পরিবর্তন</button></td>
    </tr>
    `
  })

  document.getElementById("income").innerText=income
  document.getElementById("expense").innerText=expense
  document.getElementById("balance").innerText=income-expense

  // মাসিক রিপোর্ট
  let month={}
  data.forEach(d=>{
    let m=d.date.slice(0,7)
    month[m]=(month[m]||0)+d.amount
  })
  let r=""
  for(let m in month){ r+=m+" : "+month[m]+" টাকা <br>" }
  document.getElementById("report").innerHTML=r
}

function dark(){document.body.classList.toggle("dark")}

function download(){
  let csv="member,title,date,type,amount,memberAmount,balance\n"
  data.forEach((d,i)=>{
      let bal=calculateBalance(i)
      csv+=`${d.member},${d.title},${d.date},${d.type},${d.amount},${d.memberAmount || 0},${bal}\n`
  })
  let blob=new Blob([csv])
  let a=document.createElement("a")
  a.href=URL.createObjectURL(blob)
  a.download="hisab.csv"
  a.click()
}

function calculateBalance(index){
  let inc=0, exp=0
  for(let i=0;i<=index;i++){
      if(data[i].type=="income") inc+=data[i].amount
      else exp+=data[i].amount
  }
  return inc-exp
}

function p(v){display.value+=v}
function clearCalc(){display.value=""}
function calc(){display.value=eval(display.value)}
</script>

</body>
</html>
